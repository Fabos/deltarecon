<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Negro · Targets</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="page"><section class="hero"><div><p class="eyebrow">WORKSPACE DE INVESTIGACIÓN</p><h1>No hay targets</h1><p class="muted">Crea un target nuevo o restaura un backup de Negro.</p></div></section><div class="grid two"><section class="panel"><h2>Agregar target</h2><form action="/targets/create" method="post" class="target-form"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Dominio<input name="domain" required placeholder="example.com"></label><label>Espacio de trabajo <span class="muted">(opcional)</span><input name="workspace" placeholder="~/recon/example.com"></label><button class="button" type="submit">Crear target</button></form></section><section class="panel"><h2>Restaurar backup</h2><form action="/targets/restore" method="post" enctype="multipart/form-data" class="target-form"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Backup de Negro<input type="file" name="backup" accept="application/zip,.zip" required></label><button class="button ghost" type="submit">Restaurar</button></form></section></div></main></body></html>
