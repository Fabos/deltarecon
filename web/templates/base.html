<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Negro Recon{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="dog">🐕</span><span>Negro</span><small>v{{ version }}</small></a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/hosts">Hosts</a>
      <a href="/tree">Árbol</a>
    </nav>
    <div class="target"><span class="muted">Target</span><strong>{{ domain }}</strong></div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Workspace: {{ workspace }} · local-first · sin autenticación remota</footer>
  <script src="/static/app.js"></script>
</body>
</html>
