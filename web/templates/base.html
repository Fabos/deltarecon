<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Negro Recon{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ target_base }}/"><span class="dog">🐕</span><span>Negro</span><small>v{{ version }}</small></a>
    <nav>
      <a href="{{ target_base }}/">Dashboard</a>
      <a href="{{ target_base }}/hosts">Hosts</a>
      <a href="{{ target_base }}/tree">Árbol</a>
      <a href="{{ target_base }}/graph">Mapa</a>
      <a href="{{ target_base }}/intelligence">Intelligence</a>
      <a href="{{ target_base }}/hypotheses">Hypotheses</a>
      <a href="{{ target_base }}/findings">Findings</a>
      <a href="{{ target_base }}/settings">Settings</a>
    </nav>
    <div class="target-switch-wrap">
      <label for="target-switch">Target</label>
      <select id="target-switch" data-target-switch>
        {% for t in targets %}
          <option value="/t/{{ t.key }}/" {% if t.key==target_key %}selected{% endif %}>{{ t.domain }}</option>
        {% endfor %}
      </select>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Workspace: {{ workspace }} · local-first · sin autenticación remota</footer>
  <script src="/static/app.js"></script>
</body>
</html>
