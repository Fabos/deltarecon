plugins {
    id 'java'
}

group = 'com.negro'
version = '0.14.2'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

jar {
    archiveBaseName = 'negro-burp-bridge'
    manifest {
        attributes 'Implementation-Title': 'Negro Burp Bridge', 'Implementation-Version': version
    }
}
